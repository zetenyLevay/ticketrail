name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (Azul, 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      # Also validates the Gradle wrapper and caches dependencies/build cache
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native toolchain for linuxX64Test is large; don't re-download every run
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # allTests: jvmTest + linuxX64Test + testAndroidHostTest in :core, :server, :app:shared
      # test:     :app:androidApp and :app
      - name: Run tests
        run: ./gradlew allTests test --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
